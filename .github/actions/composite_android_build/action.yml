name: 'Android Build'
description: 'Build Android AAB and APK files'

inputs:
  ANDROID_KEYSTORE_BASE64:
    description: 'Base64 encoded keystore file (should decode to .keystore)'
    required: true
  ANDROID_KEYSTORE_PASSWORD:
    description: 'Keystore password'
    required: true
  ANDROID_KEY_ALIAS:
    description: 'Key alias'
    required: true
  ANDROID_KEY_PASSWORD:
    description: 'Key password'
    required: true
  TAG_NAME:
    description: 'Release tag (e.g. 1.2.3; a leading "v" is tolerated). When empty, version is set to timestamp-test.'
    required: false
  APP_NAME:
    description: 'Prefix for the output file names (<APP_NAME>-<version>.apk/.aab).'
    required: true

outputs:
  VERSION_SUFFIX:
    description: 'Version suffix used for output filenames (tag name or timestamp-test)'
    value: ${{ steps.version_tag.outputs.VERSION_SUFFIX || steps.version_test.outputs.VERSION_SUFFIX }}
  APK:
    description: 'Path to the signed, 16KB-aligned APK'
    value: ${{ steps.rename.outputs.APK }}
  AAB:
    description: 'Path to the AAB (only built when TAG_NAME is set; empty otherwise)'
    value: ${{ steps.rename.outputs.AAB }}

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        # Caches ~/.gradle/caches + wrapper, keyed on the gradle files.
        cache: 'gradle'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    # Ensures ANDROID_HOME and cmdline-tools exist on self-hosted runners,
    # which don't ship the SDK preinstalled (unlike ubuntu-latest).
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 14742923
        # Default is 'tools platform-tools'; the legacy 'tools' package no longer
        # exists in the SDK repo and makes sdkmanager exit 1.
        packages: 'platform-tools'

    # 16KB native library alignment requires NDK r27+. Install exactly the NDK
    # android/build.gradle pins (ndkVersion = "...") so the linker emits .so
    # files with 16KB-aligned LOAD segments on every CI runner.
    - name: Install Android NDK (16KB-aligned)
      shell: bash
      run: |
        set -e
        NDK_VERSION=$(sed -n 's/.*ndkVersion *= *"\([^"]*\)".*/\1/p' android/build.gradle | head -n1)
        if [ -z "$NDK_VERSION" ]; then
          echo "::error file=android/build.gradle::ndkVersion = \"...\" not found"
          exit 1
        fi
        echo "NDK from android/build.gradle: $NDK_VERSION"
        # setup-android installs cmdline-tools under a versioned dir
        # (e.g. cmdline-tools/14742923/), not cmdline-tools/latest/. Resolve
        # sdkmanager from PATH so we don't depend on the "latest" symlink.
        SDKMANAGER="$(command -v sdkmanager)"
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

    # `npm install` runs the postinstall hook (patch-package), so native-module
    # patches are re-applied before autolinking.
    - name: Install dependencies
      shell: bash
      run: npm install

    - name: Decode keystore file
      shell: bash
      run: |
        mkdir -p android/app
        echo "${{ inputs.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

    - name: Verify keystore file
      shell: bash
      run: |
        ls -l android/app/release-key.keystore
        command -v file >/dev/null && file android/app/release-key.keystore || echo "(file command not available, skipping type check)"
        keytool -list -keystore android/app/release-key.keystore -storepass "${{ inputs.ANDROID_KEYSTORE_PASSWORD }}" || {
          echo "Keystore file is invalid or corrupted"
          exit 1
        }

    # build.gradle reads these ANDROID_* gradle properties for the release
    # signingConfig.
    - name: Set signing configs in gradle.properties
      shell: bash
      run: |
        echo "ANDROID_KEYSTORE_PASSWORD=${{ inputs.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
        echo "ANDROID_KEY_ALIAS=${{ inputs.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
        echo "ANDROID_KEY_PASSWORD=${{ inputs.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties

    - name: Set versionCode and versionName (release, when TAG_NAME is provided)
      id: version_tag
      if: ${{ inputs.TAG_NAME }}
      shell: bash
      run: |
        TAG_NAME="${{ inputs.TAG_NAME }}"
        VERSION_NAME="${TAG_NAME#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
        MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
        VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

        echo "Parsed versionName: $VERSION_NAME"
        echo "Calculated versionCode: $VERSION_CODE"
        echo "VERSION_SUFFIX=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "BUILD_VERSION_SUFFIX=$TAG_NAME" >> $GITHUB_ENV

        sed -i "/defaultConfig {/,/}/ s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
        sed -i "/defaultConfig {/,/}/ s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

    - name: Set versionCode and versionName for build (timestamp-test)
      id: version_test
      if: ${{ !inputs.TAG_NAME }}
      shell: bash
      run: |
        BUILD_SUFFIX="$(date +%Y%m%d-%H%M%S)-test"
        VERSION_CODE=$(date +%s)
        echo "VERSION_SUFFIX=$BUILD_SUFFIX" >> $GITHUB_OUTPUT
        echo "BUILD_VERSION_SUFFIX=$BUILD_SUFFIX" >> $GITHUB_ENV
        echo "Build versionName: $BUILD_SUFFIX, versionCode: $VERSION_CODE"
        sed -i "/defaultConfig {/,/}/ s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
        sed -i "/defaultConfig {/,/}/ s/versionName \".*\"/versionName \"$BUILD_SUFFIX\"/" android/app/build.gradle

    # The AAB is only needed for store uploads, so it's built for tagged
    # (release) builds only; every build gets the APK.
    - name: Build release APK (+ AAB when TAG_NAME is set)
      shell: bash
      env:
        TASKS: ${{ inputs.TAG_NAME && 'bundleRelease assembleRelease' || 'assembleRelease' }}
      run: |
        set -o pipefail
        cd android
        echo "Gradle tasks: $TASKS"
        # Stream to the job log and keep a copy for the failure artifact.
        ./gradlew clean $TASKS --no-daemon --console=plain 2>&1 | tee ../build.log

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs
        path: build.log
        retention-days: 15

    # Re-run zipalign with -P 16 so every .so inside the APK starts on a
    # 16KB page boundary. AGP 8.5+ does this automatically when
    # useLegacyPackaging=false, but we re-align defensively and then re-sign
    # because zipalign must run before apksigner.
    - name: Align APK to 16KB native library boundaries
      shell: bash
      run: |
        set -euo pipefail
        BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
        ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
        APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
        APK_IN="android/app/build/outputs/apk/release/app-release.apk"
        APK_TMP="android/app/build/outputs/apk/release/app-release-unsigned-aligned.apk"

        echo "Using build-tools: $BUILD_TOOLS_DIR"
        "$ZIPALIGN" -c -v -P 16 4 "$APK_IN" || echo "APK not yet 16KB-aligned, re-aligning..."
        "$ZIPALIGN" -f -v -P 16 4 "$APK_IN" "$APK_TMP"
        mv "$APK_TMP" "$APK_IN"

        "$APKSIGNER" sign \
          --ks android/app/release-key.keystore \
          --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
          --ks-key-alias "$ANDROID_KEY_ALIAS" \
          --key-pass pass:"$ANDROID_KEY_PASSWORD" \
          "$APK_IN"

        "$ZIPALIGN" -c -v -P 16 4 "$APK_IN"
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ inputs.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ inputs.ANDROID_KEY_PASSWORD }}

    # Verify every .so shipped inside the APK has 16KB-aligned LOAD segments.
    # The OS will refuse to mmap libs on 16KB-page devices otherwise, so fail
    # the build early instead of shipping a broken release.
    - name: Verify 16KB ELF LOAD segment alignment in .so files
      shell: bash
      run: |
        set -euo pipefail
        APK="android/app/build/outputs/apk/release/app-release.apk"
        WORK=$(mktemp -d)
        unzip -q -o "$APK" "lib/*" -d "$WORK"

        OBJDUMP=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-objdump | head -n1)
        echo "Using objdump: $OBJDUMP"

        FAIL=0
        # 64-bit ABIs must have LOAD segments aligned to 0x4000 (16KB).
        # 32-bit ABIs (armeabi-v7a, x86) keep 4KB pages — they don't run on
        # 16KB-page devices, so we only assert alignment on 64-bit libs.
        while IFS= read -r SO; do
          ABI="$(basename "$(dirname "$SO")")"
          case "$ABI" in
            arm64-v8a|x86_64)
              ALIGN=$("$OBJDUMP" -p "$SO" | awk '/LOAD/ {print $NF; exit}')
              if [[ "$ALIGN" != "2**14" && "$ALIGN" != "0x4000" && "$ALIGN" != "16384" ]]; then
                echo "::error file=$SO::LOAD segment alignment is $ALIGN, expected 2**14 (16KB)"
                FAIL=1
              else
                echo "OK   $ABI/$(basename "$SO") -> $ALIGN"
              fi
              ;;
            *)
              echo "skip $ABI/$(basename "$SO") (32-bit)"
              ;;
          esac
        done < <(find "$WORK/lib" -name '*.so')

        if [[ "$FAIL" -ne 0 ]]; then
          echo "One or more 64-bit .so files are not 16KB-aligned. See errors above."
          exit 1
        fi

    - name: Rename APK (and AAB) with version suffix
      id: rename
      shell: bash
      env:
        APP_NAME: ${{ inputs.APP_NAME }}
      run: |
        set -euo pipefail
        SUFFIX="${BUILD_VERSION_SUFFIX}"
        APK="android/app/build/outputs/apk/release/${APP_NAME}-${SUFFIX}.apk"
        mv android/app/build/outputs/apk/release/app-release.apk "$APK"
        echo "APK=$APK" >> "$GITHUB_OUTPUT"
        echo "Output: $APK"
        if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
          AAB="android/app/build/outputs/bundle/release/${APP_NAME}-${SUFFIX}.aab"
          mv android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_OUTPUT"
          echo "Output: $AAB"
        fi

    # Always runs (even after a failed step): self-hosted runners keep the
    # workspace between jobs, so don't leave the keystore, signing passwords
    # or .env on disk.
    - name: Remove signing material
      if: always()
      shell: bash
      run: |
        rm -f android/app/release-key.keystore .env
        if [ -f android/gradle.properties ]; then
          sed -i '/^ANDROID_KEY/d' android/gradle.properties
        fi
